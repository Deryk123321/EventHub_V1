<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do Usuário</title>
    <link rel="stylesheet" href="..//css/style.css">
</head>
<body>
     <header class="topbar">
        <nav>
            <a href="..\\index.html">Home</a>
            <a href="evento.html">Eventos</a>
            <a href="sobre_nos.html">Sobre Nós</a>
            <a href="login.html">Entrar(Login)</a>
            <a href="cadastro.html">Cadastro</a>
            
        </nav>
    </header>
    <main>
        <h1>Junte-se a nós e cadastre-se!</h1>
        <div class="barra">
            <div class="progresso" id="progresso"></div>
        </div>
        <div class="container">
            
            <form id="cadastro_usuario">
                <section id="dadospessoais">
                    <h2>Dados Pessoais</h2>
                    <p>Etapa 1 de 3</p>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" name="nome" id="nome" placeholder="Fulano de tal" required>
                    <label for="dtn">Data de nascimento:</label>
                    <input type="date" name="dtn" id="dtn" placeholder="XX/XX/XXXX" required>
                    <label for="cpf">Insira seu CPF:</label>
                    <input type="text" name="cpf" id="cpf" placeholder="XXX.XXX.XXX-XX" required max="14">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" name="telefone" id="telefone" placeholder="(XX) XXXXX-XXXX" required maxlength="15">
                    <label for="email">E-mail:</label>
                    <input type="email" name="email" id="email" placeholder="fulanodetal@nanana.com" required>
                    <button type="button" id="avancar1">Avançar</button>
                </section>

                <section id="endereco">
                    <h2>Endereço</h2>
                    <p>Etapa 2 de 3</p>
                    <label for="cep">CEP:</label>
                    <input type="text" name="cep" id="cep" placeholder="XXXXX-XXX" required >
                    <label for="rua">Rua:</label>
                    <input type="text" name="rua" id="rua" placeholder="Rua Tananana" required readonly>
                    <label for="numero">Número:</label>
                    <input type="number" id="numero" name="numero" placeholder="Ex.: 150" required maxlength="6">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Sala 2, Bloco A...">
                    <label for="bairro">Bairro:</label>
                    <input type="text" name="bairro" id="bairro" placeholder="Bairro Tananana" required readonly>
                    <label for="cidade">Cidade:</label>
                    <input type="text" name="cidade" id="cidade" placeholder="Cidade" required readonly>
                    <label for="uf">UF:</label>
                    <input type="text" name="uf" id="uf" maxlength="02" placeholder="SP" required readonly>
                    <button type="button" id="voltar1">Voltar</button>
                    <button type="button" id="avancar2">Avançar</button>
                </section>
                
                <section id="seguranca">
                    <h2>Segurança</h2>
                    <p>Etapa 3 de 3</p>
                    <label for="senha">Senha:</label>
                    <input type="password" name="senha" id="senha" required minlength="8">
                    <label for="confirmesenha">Confirme sua senha:</label>
                    <input type="password" name="confirmesenha" id="confirmesenha" required minlength="8">
                    <label for="termos">
                        <input type="checkbox" id="termos" name="termos" required>
                        Li e aceito os <a href="termos.html">Termos de Uso</a> e a <a href="privacidade.html"> Política de privacidade</a>
                    </label>
                    <button type="button" id="voltar2">Voltar</button>
                    <button type="submit" id="cadastrar">Cadastrar</button>
                </section>
                
            </form>
        </div>
    </main>
    <script src="../js/validacoes.js"></script>
</body>
</html>
